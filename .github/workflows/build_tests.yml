name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      # 3.13 excluded: upstream `remi` imports the removed-in-3.13 stdlib `cgi`.
      python_versions: '["3.10", "3.11", "3.12"]'
      # Network-free smoke tests across the full matrix. The HiveMind-side e2e
      # (tests/e2e/) boots a real hivemind-core server via hivescope and runs in
      # a dedicated job (e2e_tests.yml) so it doesn't drag the whole alpha stack
      # into every matrix cell. Version policy lives in pyproject (the `test`
      # extra); no pre_install pins — prerelease deps are pinned as minimums.
      install_extras: 'test'
      test_path: 'tests/test_smoke.py'
