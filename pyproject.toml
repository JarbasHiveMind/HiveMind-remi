[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-remi"
description = "REMI web GUI client for HiveMind — chat with a HiveMind-core server from the browser"
readme = "readme.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = { text = "Apache-2.0" }
# Capped below 3.13: the upstream `remi` GUI library (last released 2022)
# still does `import cgi`, which was removed from the stdlib in Python 3.13.
# There is no maintained release that works on 3.13, so this client cannot run
# there until/unless remi is replaced.
requires-python = ">=3.10,<3.13"
dynamic = ["version"]
dependencies = [
    # hivemind-bus-client 0.9.x is the 2.x-stack client (NodeIdentity-backed,
    # ssl derived from the host scheme). It requires ovos-bus-client>=2.0.0a3,
    # so the floor is the prerelease pinned as a *minimum* — pip resolves it
    # with NO --pre per repo policy.
    "hivemind-bus-client>=0.9.2a1,<1.0.0",
    "ovos-bus-client>=2.0.0a3,<3.0.0",
    "remi",
    "ovos-utils",
    # remi 2022.7.27 imports pkg_resources at runtime without declaring
    # setuptools; pkg_resources was removed in setuptools>=81, so cap it until
    # remi is updated.
    "setuptools<84",
]

[project.optional-dependencies]
# Lightweight unit/smoke deps run across the full python matrix in build_tests.
test = ["pytest"]
# Full HiveMind-side end-to-end stack: boots a REAL hivemind-core server via
# hivescope's loopback WebSocket harness and drives the REAL remi client over a
# real HiveMessageBusClient (only the remi browser/GUI surface is mocked).
# hivescope 0.5.2a1 floors hivemind-core / hivemind-bus-client onto the 2.x
# line, so these stay coherent with the runtime deps above. Prerelease floors
# (pinned as minimums; no --pre).
e2e = [
    "pytest",
    "pytest-timeout",
    "hivescope>=0.5.2a1",
    "hivemind-core>=4.6.2a1",
    # hivemind-core 4.6.x pulls in a coherent set of sibling prereleases. Each
    # is pinned here as a *minimum* so the resolver enables that prerelease
    # without a global --pre (prerelease-as-minimum policy). Without these
    # explicit floors a plain pip/uv install refuses the transitive `aN`
    # constraints hivemind-core declares.
    "json-database>=0.10.2a1",
    "hivemind-plugin-manager>=0.7.1a1",
    "hivemind-sqlite-database>=0.4.0a2",
    "hivemind-websocket-protocol>=0.2.1a1",
    "hivemind-json-db-plugin>=0.0.3a2",
    "hivemind-ovos-agent-plugin>=0.3.1a1",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/HiveMind-remi"

[project.scripts]
HiveMind-remi = "hivemind_remi.__main__:main"

[tool.setuptools]
packages = ["hivemind_remi"]
include-package-data = true

[tool.setuptools.package-data]
# The GUI serves these static assets (chatbot/speech-bubble icons, logo) from
# the package; ship them in the wheel. (MANIFEST.in is gone — pyproject is the
# single packaging source of truth.)
hivemind_remi = ["res/*"]

[tool.setuptools.dynamic]
version = { attr = "hivemind_remi.version.__version__" }
