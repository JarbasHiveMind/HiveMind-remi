[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-remi"
description = "REMI web GUI client for HiveMind — chat with a HiveMind hub from the browser"
readme = "readme.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/HiveMind-remi"

[project.scripts]
HiveMind-remi = "hivemind_remi.__main__:main"

[tool.setuptools]
packages = ["hivemind_remi"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "hivemind_remi.version.__version__" }
dependencies = { file = ["requirements.txt"] }
